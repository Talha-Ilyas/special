<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You | My Baby</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-center: #fcf3e6;
      --bg-mid: #f5e3c8;
      --bg-edge: #edd4b4;
      --burgundy: #8c1d24;
      --burgundy-soft: #a52a32;
      --ink-brown: #4a3525;
      --muted-sepia: #7e624c;
      --card-cream: #faeedc;
      --letter-peach: #f4e3ce;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
      background-color: var(--bg-mid);
      color: var(--ink-brown);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      user-select: none;
    }

    /* Background Gradients */
    .vintage-canvas-bg { position: fixed; inset: 0; z-index: -3; background: radial-gradient(circle at 50% 44%, #fcf3e6 0%, #f8ead6 38%, #f2ddc0 72%, #edd4b4 100%); }
    .watercolor-paper-grain { position: fixed; inset: 0; z-index: -2; pointer-events: none; opacity: 0.42; background-image: radial-gradient(rgba(145, 98, 56, 0.055) 1px, transparent 0), radial-gradient(rgba(140, 29, 36, 0.03) 1px, transparent 0); background-size: 22px 22px; background-position: 0 0, 11px 11px; }
    .warm-vignette { position: fixed; inset: 0; z-index: -1; pointer-events: none; box-shadow: inset 0 0 145px rgba(135, 86, 42, 0.26); }

    /* Screen Management */
    .screen { display: none; width: 100%; min-height: 100vh; position: relative; }
    .screen.active { display: flex; }

    /* Typography Helpers */
    .font-script { font-family: 'Dancing Script', cursive; }
    .font-serif-italic { font-family: 'Cormorant Garamond', 'Playfair Display', serif; font-style: italic; }
    .font-playfair { font-family: 'Playfair Display', serif; }
    .font-handwriting { font-family: 'Caveat', cursive; }
    .font-ui { font-family: 'Plus Jakarta Sans', sans-serif; }

    /* ================= SCREEN 1: SKETCHED GIFT BOX ================= */
    #screen1 { flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 2rem; cursor: pointer; transition: opacity 0.2s ease, transform 0.2s ease; }
    .gift-stage { position: relative; transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); animation: floatGiftBox 3.6s ease-in-out infinite; }
    .gift-stage:hover { transform: scale(1.065) rotate(-1.2deg); }
    .gift-stage:active { transform: scale(0.95); }
    @keyframes floatGiftBox { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    
    .gentle-pulse { animation: pulseOpacity 2.4s ease-in-out infinite; }
    @keyframes pulseOpacity { 0%, 100% { opacity: 0.65; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } }

    /* ================= SCREEN 2: BOTANICAL WATERCOLOR ROSE CURTAIN ================= */
    #screen2 { position: fixed; inset: 0; z-index: 100; pointer-events: none; overflow: hidden; }
    .botanical-rose-item { position: absolute; transform: translate(-50%, calc(-50% - 30px)) scale(0); opacity: 0; will-change: transform, left, top, opacity; transition: transform 0.68s cubic-bezier(0.22, 1.32, 0.36, 1), left 1.25s cubic-bezier(0.65, 0, 0.25, 1), opacity 0.9s ease; filter: drop-shadow(0 10px 16px rgba(96, 44, 38, 0.24)); }

    /* ================= SCREEN 3: 3 ROMANTIC SCROLL SECTIONS & CORNERS ================= */
    #screen3 { flex-direction: column; align-items: center; width: 100%; position: relative; overflow-x: hidden; }

    /* 4 Corners Styling */
    /* 4 Corners Styling */
    .floral-corner {
      position: fixed; /* Screen par fix karne ke liye */
      width: 170px; /* Size thora bara kar diya */
      height: 170px;
      pointer-events: none;
      z-index: 20;
      animation: gentleCornerBreeze 7s ease-in-out infinite;
      /* Halka sa soft aur warm shadow add kiya hai */
      filter: drop-shadow(2px 8px 14px rgba(90, 50, 30, 0.3)); 
    }
    @media (min-width: 768px) {
      .floral-corner { width: 260px; height: 260px; }
    }
    .corner-tl { top: -10px; left: -10px; transform-origin: top left; }
    .corner-tr { top: -10px; right: -10px; transform-origin: top right; }
    .corner-bl { bottom: 5px; left: -10px; transform-origin: bottom left; }
    .corner-br { bottom: 5px; right: -10px; transform-origin: bottom right; }
    
    @keyframes gentleCornerBreeze { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(2.5deg); } }

    /* Blend mode for Black Background JPGs */
    .blend-screen { mix-blend-mode: screen; opacity: 0.9; }

    .story-section { min-height: 94vh; width: 100%; max-width: 820px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 3.5rem 1.5rem; position: relative; }

    /* Section 2: Cream Stationery Quote Card */
    .quote-stationery-card { background: linear-gradient(145deg, #fdf4e6 0%, #f8e7cf 100%); padding: 3rem 3.6rem; border-radius: 16px; box-shadow: 0 20px 45px rgba(118, 78, 44, 0.13), 0 5px 14px rgba(118, 78, 44, 0.07), inset 0 0 0 1px rgba(255, 255, 255, 0.65); position: relative; max-width: 570px; width: 100%; transition: transform 0.4s ease, box-shadow 0.4s ease; }
    .quote-stationery-card:hover { transform: translateY(-5px); box-shadow: 0 26px 52px rgba(118, 78, 44, 0.17), 0 6px 16px rgba(118, 78, 44, 0.08), inset 0 0 0 1px rgba(255, 255, 255, 0.75); }
    
    .marker-pink { background: linear-gradient(104deg, rgba(244, 168, 182, 0) 1%, rgba(244, 168, 182, 0.68) 2.8%, rgba(244, 168, 182, 0.48) 93%, rgba(244, 168, 182, 0) 99%); color: #b02340; padding: 0.04em 0.36em; border-radius: 7px; }
    .marker-sage { background: linear-gradient(104deg, rgba(164, 212, 182, 0) 1%, rgba(164, 212, 182, 0.68) 2.8%, rgba(164, 212, 182, 0.48) 93%, rgba(164, 212, 182, 0) 99%); color: #2b6a4b; padding: 0.04em 0.36em; border-radius: 7px; }
    .marker-rose { background: linear-gradient(104deg, rgba(242, 158, 174, 0) 1%, rgba(242, 158, 174, 0.68) 2.8%, rgba(242, 158, 174, 0.48) 93%, rgba(242, 158, 174, 0) 99%); color: #a8203d; padding: 0.04em 0.36em; border-radius: 7px; }
    .marker-amber { background: linear-gradient(104deg, rgba(245, 202, 140, 0) 1%, rgba(245, 202, 140, 0.72) 2.8%, rgba(245, 202, 140, 0.52) 93%, rgba(245, 202, 140, 0) 99%); color: #b56616; padding: 0.04em 0.36em; border-radius: 7px; }

    /* Section 3: Heart Padlock Trigger & Animation */
    .heart-lock-trigger { cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .heart-lock-trigger:hover { transform: scale(1.1) translateY(-3px); }
    .heart-lock-trigger:active { transform: scale(0.95); }

    .lock-float { animation: gentleFloat 3.5s ease-in-out infinite; }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .lock-warm-aura { position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%); width: 155px; height: 155px; background: radial-gradient(circle, rgba(226, 145, 92, 0.36) 0%, rgba(226, 145, 92, 0.12) 48%, transparent 72%); border-radius: 50%; z-index: -1; animation: pulseOpacity 2.8s infinite; }

    /* ================= REST OF STYLES (MODALS, POLAROIDS) ================= */
    #screen4 { position: fixed; inset: 0; z-index: 60; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; background: radial-gradient(circle at 50% 44%, rgba(253, 245, 232, 0.96) 0%, rgba(244, 224, 198, 0.98) 58%, rgba(232, 204, 168, 0.99) 100%); backdrop-filter: blur(10px); animation: modalFadeIn 0.35s ease; }
    @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    .modal-lock-pedestal { width: 98px; height: 98px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fbead0 0%, #ecd0a8 100%); box-shadow: 0 10px 26px rgba(132, 86, 44, 0.17), inset 0 2px 5px rgba(255, 255, 255, 0.78); display: flex; justify-content: center; align-items: center; margin-bottom: 0.75rem; }
    .connected-dots-bar { position: relative; display: flex; align-items: center; justify-content: center; gap: 20px; margin: 0.65rem 0 0.35rem; }
    .connected-dots-bar::before { content: ""; position: absolute; left: 8px; right: 8px; height: 1.5px; background: rgba(152, 118, 90, 0.42); z-index: 0; }
    .passkey-dot { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid #967356; background: #fbf1e2; position: relative; z-index: 1; transition: all 0.22s ease; }
    .passkey-dot.filled { background: #2d6a4f; border-color: #2d6a4f; box-shadow: 0 0 9px rgba(45, 106, 79, 0.45); transform: scale(1.12); }
    .passkey-dot.error { background: #b8252b; border-color: #b8252b; box-shadow: 0 0 9px rgba(184, 37, 43, 0.5); }
    .shake-anim { animation: errorShake 0.42s ease-in-out; }
    @keyframes errorShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    .numpad-grid { display: grid; grid-template-columns: repeat(3, 68px); gap: 14px; margin-top: 0.4rem; }
    .numpad-key { width: 68px; height: 68px; border-radius: 50%; border: 1px solid rgba(178, 142, 108, 0.3); background: radial-gradient(circle at 32% 30%, #fffbf5 0%, #f4e5ce 100%); box-shadow: 0 6px 15px rgba(120, 82, 46, 0.085), inset 0 1px 2px rgba(255, 255, 255, 0.88); font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.45rem; font-weight: 600; color: #543b2a; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.18s ease; }
    .numpad-key:hover { background: radial-gradient(circle at 50% 50%, #fbe4d0 0%, #efcbb0 100%); box-shadow: 0 7px 18px rgba(184, 100, 66, 0.22); transform: translateY(-1.5px); }
    .numpad-key:active { transform: scale(0.92); background: #e9ccb0; }

    #screen5 { flex-direction: column; justify-content: center; align-items: center; position: relative; }
    .vintage-wreath-rings { position: relative; width: 280px; height: 280px; display: flex; justify-content: center; align-items: center; }
    .vintage-wreath-rings::before, .vintage-wreath-rings::after { content: ""; position: absolute; border-radius: 50%; border: 1px dashed rgba(162, 120, 84, 0.25); pointer-events: none; }
    .vintage-wreath-rings::before { width: 236px; height: 236px; }
    .vintage-wreath-rings::after { width: 306px; height: 306px; border-style: solid; border-color: rgba(162, 120, 84, 0.11); }
    .wreath-spinner-wheel { position: relative; width: 176px; height: 176px; animation: spinRoseWreath 6.2s linear infinite; }
    @keyframes spinRoseWreath { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .wreath-rose-slot { position: absolute; top: 50%; left: 50%; width: 64px; height: 64px; margin-top: -32px; margin-left: -32px; filter: drop-shadow(0 6px 10px rgba(96, 44, 38, 0.22)); }

    #screen6 { flex-direction: column; align-items: center; padding: 4.5rem 1.25rem 6.5rem; width: 100%; }
    .polaroid-scatter-stage { max-width: 1060px; width: 100%; display: grid; grid-template-columns: repeat(12, 1fr); gap: 1.65rem; margin-bottom: 5rem; position: relative; }
    .polaroid-frame { background: #fffdf9; padding: 11px 11px 38px 11px; border-radius: 3px; box-shadow: 0 16px 32px rgba(74, 46, 24, 0.17), 0 4px 10px rgba(74, 46, 24, 0.08); position: relative; transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.42s ease; cursor: pointer; }
    .polaroid-frame:hover { transform: rotate(0deg) scale(1.05) translateY(-6px) !important; z-index: 30; box-shadow: 0 24px 46px rgba(74, 46, 24, 0.26); }
    .polaroid-tape { position: absolute; top: -13px; left: 50%; transform: translateX(-50%) rotate(-2deg); width: 88px; height: 26px; background: rgba(246, 234, 209, 0.8); border-left: 2px dotted rgba(192, 170, 134, 0.48); border-right: 2px dotted rgba(192, 170, 134, 0.48); box-shadow: 0 2px 5px rgba(84, 56, 28, 0.08); z-index: 4; pointer-events: none; }
    .polaroid-photo-box { width: 100%; overflow: hidden; background: #ebd9c5; position: relative; }
    .polaroid-photo-box img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.65s ease; }
    .polaroid-frame:hover .polaroid-photo-box img { transform: scale(1.045); }

    .pol-1 { grid-column: span 3; transform: rotate(-5.2deg) translateY(8px); }
    .pol-2 { grid-column: span 3; transform: rotate(3.4deg) translateY(-10px); }
    .pol-3 { grid-column: span 3; transform: rotate(-2.6deg) translateY(-4px); }
    .pol-4 { grid-column: span 3; transform: rotate(4.8deg) translateY(14px); }
    .pol-5 { grid-column: span 3; transform: rotate(3.2deg) translateY(6px); }
    .pol-6 { grid-column: span 3; transform: rotate(-4.1deg) translateY(-12px); }
    .pol-7 { grid-column: span 3; transform: rotate(2.7deg) translateY(-6px); }
    .pol-8 { grid-column: span 3; transform: rotate(-3.6deg) translateY(10px); }

    @media (max-width: 900px) { .pol-1, .pol-2, .pol-3, .pol-4, .pol-5, .pol-6, .pol-7, .pol-8 { grid-column: span 6; } }
    @media (max-width: 540px) { .polaroid-scatter-stage { grid-template-columns: repeat(2, 1fr); gap: 1.15rem; } .pol-1, .pol-2, .pol-3, .pol-4, .pol-5, .pol-6, .pol-7, .pol-8 { grid-column: span 1; } .quote-stationery-card { padding: 2.1rem 1.4rem; } }

    .letter-stationery-wrap { position: relative; max-width: 730px; width: 100%; margin: 1rem auto 4.2rem; }
    .letter-tape-left { position: absolute; top: -12px; left: 26px; width: 112px; height: 28px; background: rgba(247, 236, 214, 0.8); transform: rotate(-8deg); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.07); z-index: 4; }
    .letter-tape-right { position: absolute; top: -10px; right: 30px; width: 108px; height: 28px; background: rgba(247, 236, 214, 0.8); transform: rotate(7deg); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.07); z-index: 4; }
    .lined-stationery-sheet { width: 100%; min-height: 530px; background-color: var(--letter-peach); background-image: linear-gradient(180deg, rgba(255, 249, 244, 0.45) 0%, rgba(235, 208, 192, 0.35) 100%), repeating-linear-gradient(to bottom, transparent 0px, transparent 37px, rgba(165, 124, 110, 0.27) 38px); background-attachment: local; padding: 44px 44px 54px; border-radius: 6px; box-shadow: 0 22px 48px rgba(88, 52, 34, 0.16), 0 5px 14px rgba(88, 52, 34, 0.08), inset 0 0 42px rgba(218, 174, 152, 0.25); font-family: 'Caveat', cursive; font-size: 1.64rem; line-height: 38px; color: #3a2921; letter-spacing: 0.3px; position: relative; }
    @media (max-width: 600px) { .lined-stationery-sheet { padding: 36px 22px 44px; font-size: 1.4rem; } }
    .ink-cursor { display: inline-block; width: 2px; height: 1.15em; background-color: var(--burgundy); vertical-align: text-bottom; margin-left: 2px; animation: blinkInk 0.8s steps(2, start) infinite; }
    @keyframes blinkInk { to { visibility: hidden; } }
  </style>
</head>
<body>

  <!-- Background Layers -->
  <div class="vintage-canvas-bg"></div>
  <div class="watercolor-paper-grain"></div>
  <div class="warm-vignette"></div>

  <!-- Music Toggle -->
  <button id="musicToggleBtn" onclick="toggleRomanticMelody(event)" title="Toggle Romantic Melody"
    class="fixed bottom-5 right-5 z-50 w-11 h-11 rounded-full bg-[#fdf4e6]/90 border border-[#d6b793] shadow-md flex items-center justify-center text-[#7c5338] hover:scale-105 transition-transform">
    <svg id="iconSoundPlaying" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M11 5L6 9H2v6h4l5 4V5z" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07" stroke-linecap="round"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14" stroke-linecap="round"/>
    </svg>
    <svg id="iconSoundMuted" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M9 18V5l12-2v13" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
  </button>

  <!-- SCREEN 1 -->
  <section id="screen1" class="screen active" onclick="triggerGiftOpening()">
    <div class="gift-stage">
      <canvas id="giftBoxCanvas" width="520" height="500" class="w-60 h-60 md:w-64 md:h-64"></canvas>
    </div>
    <h1 class="font-script text-4xl md:text-5xl text-[#8c1d24] mt-2 tracking-wide drop-shadow-sm">For you, my baby.</h1>
    <p class="font-serif-italic text-base md:text-lg text-[#7e624c] mt-3 gentle-pulse">(tap to open)</p>
  </section>

  <!-- SCREEN 2: ROSE CURTAIN -->
  <div id="screen2" class="screen"></div>

  <!-- SCREEN 3 -->
  <main id="screen3" class="screen">
    
    <!-- ==============================================
         4 CORNER FLOWERS USING PROVIDED IMAGES 
    =============================================== -->
    <!-- ==============================================
         4 CORNER FLOWERS USING PROVIDED IMAGES 
    =============================================== -->
    <!-- Top Left -->
    <div class="floral-corner corner-tl">
      <img src="Flower (2).png" alt="Flower Top Left" class="w-full h-full object-contain opacity-95" />
    </div>
    <!-- Top Right (using blend-screen) -->
    <div class="floral-corner corner-tr">
      <img src="Flower (7).png" alt="Flower Top Right" class="w-full h-full object-contain blend-screen" />
    </div>
    <!-- Bottom Left (using blend-screen) -->
    <div class="floral-corner corner-bl">
      <img src="Flower (8).png" alt="Flower Bottom Left" class="w-full h-full object-contain blend-screen" />
    </div>
    <!-- Bottom Right -->
    <div class="floral-corner corner-br">
      <img src="Flower (10).png" alt="Flower Bottom Right" class="w-full h-full object-contain opacity-95" />
    </div>

    <!-- Section 1 -->
    <section class="story-section">
      <h1 class="font-script text-5xl sm:text-6xl md:text-7xl text-[#8c1d24] mb-3 tracking-wide">From me to you.</h1>
      <p class="font-serif-italic text-xl md:text-2xl text-[#5e4331] mb-6">This is how much I love you.</p>
      <div class="relative w-80 sm:w-96 md:w-[430px] my-1 flex flex-col items-center">
        <img src="Couple (4).png" alt="Couple Sitting" class="w-full h-auto drop-shadow-xl" />
        <div class="flex items-center gap-4 mt-6 text-[#9e2a2b]">
          <span class="w-1.5 h-1.5 rounded-full bg-[#b07d56]"></span>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          <span class="w-1.5 h-1.5 rounded-full bg-[#b07d56]"></span>
        </div>
      </div>
    </section>

    <!-- Section 2 -->
    <section class="story-section">
      <div class="quote-stationery-card">
        <span class="absolute top-3.5 left-4 text-[#c96b72] text-xs opacity-80">♥</span>
        <span class="absolute top-3.5 right-4 text-[#c96b72] text-xs opacity-80">♥</span>
        <span class="absolute bottom-3.5 left-4 text-[#c96b72] text-xs opacity-80">♥</span>
        <span class="absolute bottom-3.5 right-4 text-[#c96b72] text-xs opacity-80">♥</span>
        <p class="font-script text-3xl sm:text-4xl text-[#2d211c] leading-relaxed mb-4">
          In your <span class="marker-pink">smile</span>, I found my <span class="marker-sage">peace</span>.
        </p>
        <p class="font-script text-3xl sm:text-4xl text-[#2d211c] leading-relaxed">
          In your <span class="marker-rose">love</span>, I found my <span class="marker-amber">home</span>.
        </p>
      </div>
    </section>

    <!-- Section 3: Animated Lock -->
    <section class="story-section">
      <div class="heart-lock-trigger" onclick="openLockpadModal()">
        <div class="lock-warm-aura"></div>
        <!-- Lock animation class added here! -->
        <canvas id="section3LockCanvas" width="280" height="280" class="w-28 h-28 md:w-32 md:h-32 lock-float"></canvas>
        <p class="font-serif-italic text-base md:text-lg text-[#7e624c] mt-2 gentle-pulse">tap to open</p>
      </div>
    </section>
  </main>

  <!-- SCREEN 4 -->
  <section id="screen4" class="screen">
    <button onclick="closeLockpadModal()" aria-label="Close Lockpad" class="absolute top-6 right-6 w-10 h-10 rounded-full bg-[#fffaf2] border border-[#dec3a2] shadow-sm flex items-center justify-center text-[#6e503b] hover:scale-105 transition-transform">✕</button>
    <div class="modal-lock-pedestal">
      <canvas id="modalLockCanvas" width="220" height="220" class="w-16 h-16"></canvas>
    </div>
    <h2 id="passkeyTitle" class="font-script text-3xl md:text-4xl text-[#8c1d24] tracking-wide">Enter Passkey</h2>
    <div id="passkeyDotsContainer" class="connected-dots-bar">
      <div class="passkey-dot"></div><div class="passkey-dot"></div><div class="passkey-dot"></div><div class="passkey-dot"></div>
    </div>
    <div class="h-6 flex items-center justify-center"><p id="passkeyStatusText" class="font-serif-italic text-sm text-[#967356]">(Passkey: 1234)</p></div>
    <div class="numpad-grid">

      <button class="numpad-key" onclick="enterDigit('2')">2</button>

    function drawArtisanalHeartLock(canvasId, shackleLift = 0) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return; const ctx = canvas.getContext('2d'); const w = canvas.width; const h = canvas.height; ctx.clearRect(0, 0, w, h);

        ctx.bezierCurveTo(cx + size * 0.56, cy - size * 0.82, cx + size * 0.98, cy - size * 0.62, cx + size * 0.98, cy - size * 0.18);

      traceHeartPath(140, 150, 77); const heartGrad = ctx.createLinearGradient(75, 90, 205, 220); heartGrad.addColorStop(0, '#ffe0c2'); heartGrad.addColorStop(0.38, '#f6b282'); heartGrad.addColorStop(0.78, '#e08553'); heartGrad.addColorStop(1, '#ba5d30'); ctx.fillStyle = heartGrad; ctx.fill();

    const SECRET_PASSKEY = "1234";

    function showOnlyScreen(screenId) {

    }

    function triggerGiftOpening() {
      if (isGiftOpening) return; isGiftOpening = true; startRomanticMelody();
      const screen1 = document.getElementById('screen1'), screen2 = document.getElementById('screen2'), screen3 = document.getElementById('screen3');
      screen1.style.opacity = '0'; screen1.style.transform = 'scale(0.95)';
      setTimeout(() => {
        screen1.classList.remove('active'); screen1.style.opacity = ''; screen1.style.transform = '';
        screen2.innerHTML = ''; screen2.classList.add('active');
        const paletteKeys = ['pink', 'peach', 'ivory']; const roseSpecs = []; const bandsY = 15; const rosesPerBand = 11; const minSide = Math.min(window.innerWidth, window.innerHeight); const baseRoseSize = Math.max(window.innerWidth / 7.2, window.innerHeight / 6.8, minSide * 0.22);
        for (let b = 0; b < bandsY; b++) {
          const xSlots = Array.from({ length: rosesPerBand }, (_, idx) => idx);
          for (let i = xSlots.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [xSlots[i], xSlots[j]] = [xSlots[j], xSlots[i]]; }
          for (let s = 0; s < rosesPerBand; s++) {
            const slotX = xSlots[s]; const leftVW = -6 + (slotX / (rosesPerBand - 1)) * 112 + (Math.random() * 9 - 4.5); const topVH = -6 + (b / (bandsY - 1)) * 112 + (Math.random() * 8 - 4); const palKey = paletteKeys[Math.floor(Math.random() * paletteKeys.length)]; const finalScale = 0.88 + Math.random() * 0.38; const randomAngle = Math.floor(Math.random() * 360);

    let typewriterInterval = null; let hasLetterStarted = false;
    function observeLetterScroll() {

      const target = document.getElementById('letterPaperTarget');

      obs.observe(target);
    }

    function runTypewriterAnimation() {
      const textSpan = document.getElementById('typewriterLetterText'); const cursorSpan = document.getElementById('typewriterCursor'); textSpan.textContent = ''; let index = 0;

    }
    function navigateBackToScreen3() { if (typewriterInterval) clearInterval(typewriterInterval); showOnlyScreen('screen3'); }

    let audioContext = null; let musicPlaying = false; let chordLoopTimer = null;
    const WARM_ROMANTIC_NOTES = [ 261.63, 329.63, 392.00, 493.88, 220.00, 261.63, 329.63, 392.00, 174.61, 220.00, 261.63, 349.23, 196.00, 246.94, 293.66, 392.00 ]; let currentNoteIdx = 0;
    function ensureAudioContext() { if (!audioContext) { const AudioCtx = window.AudioContext || window.webkitAudioContext; if (AudioCtx) audioContext = new AudioCtx(); } if (audioContext && audioContext.state === 'suspended') audioContext.resume(); }
    
    function playWarmNote(freq, duration = 2.3, gainLevel = 0.042) {
      if (!audioContext || !musicPlaying) return;
      try { const now = audioContext.currentTime; const osc = audioContext.createOscillator(); const gain = audioContext.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now); gain.gain.setValueAtTime(0.0001, now); gain.gain.exponentialRampToValueAtTime(gainLevel, now + 0.09); gain.gain.exponentialRampToValueAtTime(0.0001, now + duration); osc.connect(gain); gain.connect(audioContext.destination); osc.start(now); osc.stop(now + duration + 0.05); } catch (err) {}
    }

    function startRomanticMelody() {
      ensureAudioContext(); if (musicPlaying) return; musicPlaying = true; refreshSoundIcons();
      chordLoopTimer = setInterval(() => { if (!musicPlaying) return; const freq = WARM_ROMANTIC_NOTES[currentNoteIdx % WARM_ROMANTIC_NOTES.length]; playWarmNote(freq, 2.4, 0.04); if (currentNoteIdx % 4 === 0) playWarmNote(freq * 0.5, 3.2, 0.028); currentNoteIdx++; }, 640);
    }

    function toggleRomanticMelody(e) { if (e) e.stopPropagation(); ensureAudioContext(); if (musicPlaying) { musicPlaying = false; if (chordLoopTimer) clearInterval(chordLoopTimer); } else { startRomanticMelody(); } refreshSoundIcons(); }
    function refreshSoundIcons() { const playingIcon = document.getElementById('iconSoundPlaying'); const mutedIcon = document.getElementById('iconSoundMuted'); if (musicPlaying) { playingIcon.classList.remove('hidden'); mutedIcon.classList.add('hidden'); } else { playingIcon.classList.add('hidden'); mutedIcon.classList.remove('hidden'); } }
    
    function playKeyTone(freq = 600) {
      ensureAudioContext(); if (!audioContext) return;
      try { const now = audioContext.currentTime; const osc = audioContext.createOscillator(); const gain = audioContext.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now); gain.gain.setValueAtTime(0.038, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12); osc.connect(gain); gain.connect(audioContext.destination); osc.start(now); osc.stop(now + 0.13); } catch (err) {}
    }
    function playSuccessChime() { [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => { setTimeout(() => playKeyTone(f), idx * 90); }); }
    function playErrorBuzzer() { [220, 192].forEach((f, idx) => { setTimeout(() => playKeyTone(f), idx * 140); }); }

    window.addEventListener('DOMContentLoaded', () => { drawHandSketchedGiftBox(); drawArtisanalHeartLock('section3LockCanvas', 0); drawArtisanalHeartLock('modalLockCanvas', 0); });
  </script>
